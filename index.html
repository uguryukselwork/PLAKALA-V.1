<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="Anonim plaka iletişimi, acil araç bildirim sistemi ve cam QR sticker uygulaması." />
    <meta property="og:title" content="Plakala — Kornaya Gerek Yok" />
    <meta property="og:description" content="Anonim plaka iletişimi, acil araç bildirim sistemi ve cam QR sticker uygulaması." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f9fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plakala" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:image" content="/pwa-512x512.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Fonts: Plus Jakarta Sans & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
    <!-- Theme initialization script to prevent white flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('plakala_settings');
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && parsed.theme === 'dark') {
              document.documentElement.classList.add('dark');
              document.documentElement.setAttribute('data-theme', 'dark');
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#eef2f6] dark:bg-[#101215] text-[#111315] dark:text-[#f8fafc] antialiased selection:bg-[#d8ff35] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
